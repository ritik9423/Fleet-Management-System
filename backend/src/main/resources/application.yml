spring:
  application:
    name: fleet-ops

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fleetops_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FleetOpsHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000          # 5 minutes
      max-lifetime: 600000          # 10 minutes (recycles before cloud DB drops socket)
      connection-timeout: 20000     # 20 seconds
      keepalive-time: 30000         # 30 seconds (pings remote MySQL so connections stay warm)
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ZmxlZXRvcHNhcGlzZWNyZXRrZXlmb3Jqd3RhdXRoMjAyNg==}
    expiration: 86400000
  mappls:
    api-key: ${MAPPLS_API_KEY:}
    client-id: ${MAPPLS_CLIENT_ID:}
    client-secret: ${MAPPLS_CLIENT_SECRET:}
  intouch:
    client-id: ${INTOUCH_CLIENT_ID:${MAPPLS_CLIENT_ID:}}
    client-secret: ${INTOUCH_CLIENT_SECRET:${MAPPLS_CLIENT_SECRET:}}
    base-url: ${INTOUCH_BASE_URL:https://intouch.mapmyindia.in/iot}
    outpost-url: ${INTOUCH_OUTPOST_URL:https://outpost.mapmyindia.com/api/security/v2.2.3/oauth/token}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha
